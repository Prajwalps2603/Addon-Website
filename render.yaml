# Render Blueprint: one web service serves the API (/api) and the built storefront.
# SQLite and uploaded photos live on a persistent disk, which needs a paid instance (Starter or higher).
services:
  - type: web
    name: addon-store
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm --prefix server ci && npm --prefix client ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: addon-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/addon.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      # Generated once by Render.
      - key: JWT_SECRET
        generateValue: true
      # You are asked for these when you create the Blueprint.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # The public address of the site, for example https://addon-store.onrender.com
      - key: PUBLIC_URL
        sync: false
      # Optional: leave blank to hide Razorpay / log emails to the console.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
